# Tiny Tapeout project information
project:
  title:        "Attention Scorer"
  author:       "Ha Le"
  discord:      ""
  description:  "Streaming int8 attention scoring primitive: dot-product a stored query against streamed keys, track the argmax"
  language:     "TL-Verilog"
  clock_hz:     40000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_hale_attn_scorer"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "DATA0"
  ui[1]: "DATA1"
  ui[2]: "DATA2"
  ui[3]: "DATA3"
  ui[4]: "DATA4"
  ui[5]: "DATA5"
  ui[6]: "DATA6"
  ui[7]: "DATA7"

  # Outputs
  uo[0]: "RES0"
  uo[1]: "RES1"
  uo[2]: "RES2"
  uo[3]: "RES3"
  uo[4]: "RES4"
  uo[5]: "RES5"
  uo[6]: "RES6"
  uo[7]: "RES7"

  # Bidirectional pins
  uio[0]: "CMD0"
  uio[1]: "CMD1"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
